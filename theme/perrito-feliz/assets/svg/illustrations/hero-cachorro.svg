<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none" aria-labelledby="cach-title" role="img">
  <title id="cach-title">Cachorro feliz con biberon y corazon</title>

  <!-- BG -->
  <circle cx="300" cy="260" r="230" fill="#FBF6EC"/>
  <circle cx="300" cy="260" r="195" fill="#F5EDE0"/>

  <!-- Blanket circle -->
  <ellipse cx="300" cy="380" rx="200" ry="40" fill="#E97B3F" opacity="0.15"/>
  <ellipse cx="300" cy="385" rx="180" ry="28" fill="#E97B3F" opacity="0.2"/>

  <!-- Puppy body -->
  <g>
    <!-- Body chubby -->
    <ellipse cx="300" cy="320" rx="120" ry="90" fill="#D7B98A"/>
    <!-- White belly -->
    <ellipse cx="300" cy="340" rx="85" ry="65" fill="#FBF6EC"/>

    <!-- Head big for puppy proportions -->
    <circle cx="300" cy="210" r="95" fill="#D7B98A"/>
    <!-- Face lighter -->
    <ellipse cx="300" cy="230" rx="70" ry="60" fill="#FBF6EC"/>

    <!-- Floppy ears -->
    <path d="M210 200c-15-10-25-5-30 15s5 50 25 55c15 4 25-10 20-30z" fill="#A8895F"/>
    <path d="M390 200c15-10 25-5 30 15s-5 50-25 55c-15 4-25-10-20-30z" fill="#A8895F"/>

    <!-- Eyes closed happy -->
    <path d="M270 210c5-8 15-8 20 0" stroke="#1A2E3D" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M310 210c5-8 15-8 20 0" stroke="#1A2E3D" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Blush cheeks -->
    <circle cx="250" cy="240" r="12" fill="#E97B3F" opacity="0.4"/>
    <circle cx="350" cy="240" r="12" fill="#E97B3F" opacity="0.4"/>

    <!-- Nose -->
    <ellipse cx="300" cy="250" rx="10" ry="7" fill="#1A2E3D"/>

    <!-- Open happy mouth -->
    <path d="M285 262c0 15 10 25 15 25s15-10 15-25c-5 3-10 4-15 4s-10-1-15-4z" fill="#1A2E3D"/>
    <path d="M292 280c0 4 4 7 8 7s8-3 8-7z" fill="#E97B3F"/>

    <!-- Paws -->
    <ellipse cx="230" cy="400" rx="30" ry="18" fill="#A8895F"/>
    <ellipse cx="370" cy="400" rx="30" ry="18" fill="#A8895F"/>
    <ellipse cx="235" cy="400" rx="18" ry="10" fill="#FBF6EC"/>
    <ellipse cx="365" cy="400" rx="18" ry="10" fill="#FBF6EC"/>

    <!-- Tail wag -->
    <path d="M420 290c25 0 45 15 50 30" stroke="#A8895F" stroke-width="22" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Bottle/biberon floating -->
  <g transform="translate(80 150)">
    <rect x="10" y="30" width="50" height="70" rx="8" fill="#FFFFFF" stroke="#2D8659" stroke-width="4"/>
    <rect x="15" y="50" width="40" height="45" rx="4" fill="#FBF6EC"/>
    <path d="M25 10h20v25h-20z" fill="#E97B3F"/>
    <ellipse cx="35" cy="10" rx="12" ry="6" fill="#D84315"/>
    <!-- Milk level indicator -->
    <line x1="20" y1="60" x2="50" y2="60" stroke="#2D8659" stroke-width="1.5" opacity="0.5"/>
    <line x1="20" y1="75" x2="50" y2="75" stroke="#2D8659" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Vaccine/syringe floating -->
  <g transform="translate(460 120) rotate(30)">
    <rect x="0" y="15" width="60" height="12" rx="2" fill="#FFFFFF" stroke="#2D8659" stroke-width="3"/>
    <rect x="60" y="18" width="10" height="6" fill="#2D8659"/>
    <line x1="70" y1="21" x2="85" y2="21" stroke="#6B8293" stroke-width="3" stroke-linecap="round"/>
    <rect x="-10" y="12" width="12" height="18" rx="2" fill="#2D8659"/>
  </g>

  <!-- Hearts floating -->
  <g transform="translate(120 380)">
    <path d="M20 30c-8-6-18-13-18-22 0-7 5-11 11-11 4 0 6 2 7 5 1-3 3-5 7-5 6 0 11 4 11 11 0 9-10 16-18 22z" fill="#E97B3F"/>
  </g>
  <g transform="translate(470 370)">
    <path d="M15 20c-5-4-12-8-12-14 0-4 3-7 7-7 3 0 4 1 5 3 1-2 2-3 5-3 4 0 7 3 7 7 0 6-7 10-12 14z" fill="#E97B3F"/>
  </g>
  <g transform="translate(530 220)">
    <path d="M10 14c-4-3-8-6-8-10 0-3 2-5 5-5 2 0 3 1 3 2 1-1 2-2 3-2 3 0 5 2 5 5 0 4-4 7-8 10z" fill="#2D8659"/>
  </g>
</svg>
